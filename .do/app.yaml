name: clothing-store-api
region: sgp
services:
  - name: api
    github:
      branch: main
      deploy_on_push: true
      repo: pqkhai2401/clothing-store-website
    build_command: npm ci && npm run build && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
    run_command: heroku-php-apache2 public/
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: APP_NAME
        value: "HK Store"
        scope: RUN_AND_BUILD_TIME
      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: APP_DEBUG
        value: "false"
        scope: RUN_AND_BUILD_TIME
      - key: APP_KEY
        value: "base64:1vQtHWJ0VS408flDKRvrMGGnd0K/K/pYLbNOu4oYYf0="
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ""  # Điền URL app DO sau khi tạo (vd: https://clothing-store-api-xxxxx.ondigitalocean.app)
      - key: LOG_CHANNEL
        value: stderr
        scope: RUN_TIME
      - key: LOG_LEVEL
        value: error
        scope: RUN_TIME
      - key: DB_CONNECTION
        value: mysql
        scope: RUN_AND_BUILD_TIME
      - key: DB_HOST
        value: ${clothing-store-db.HOSTNAME}
        scope: RUN_AND_BUILD_TIME
      - key: DB_PORT
        value: ${clothing-store-db.PORT}
        scope: RUN_AND_BUILD_TIME
      - key: DB_DATABASE
        value: cloth_db
        scope: RUN_AND_BUILD_TIME
      - key: DB_USERNAME
        value: ${clothing-store-db.USERNAME}
        scope: RUN_AND_BUILD_TIME
      - key: DB_PASSWORD
        value: ${clothing-store-db.PASSWORD}
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
        scope: RUN_AND_BUILD_TIME
      - key: SESSION_DRIVER
        value: database
        scope: RUN_TIME
      - key: CACHE_STORE
        value: database
        scope: RUN_TIME
      - key: QUEUE_CONNECTION
        value: database
        scope: RUN_TIME
      - key: MAIL_MAILER
        value: smtp
        scope: RUN_TIME
      - key: MAIL_HOST
        value: smtp.gmail.com
        scope: RUN_TIME
      - key: MAIL_PORT
        value: "587"
        scope: RUN_TIME
      - key: MAIL_USERNAME
        value: ""  # Điền email Gmail dùng để gửi mail
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_PASSWORD
        value: ""  # Điền App Password Gmail
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_ENCRYPTION
        value: tls
        scope: RUN_TIME
      - key: MAIL_FROM_ADDRESS
        value: ""  # Điền email hiển thị khi gửi mail
        scope: RUN_TIME
      - key: MAIL_FROM_NAME
        value: "HK STORE"
        scope: RUN_TIME
      - key: PASSPORT_CLIENT_ID
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PASSPORT_CLIENT_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_REDIRECT_URI
        value: "${APP_URL}/auth/google/callback"
        scope: RUN_TIME
      - key: PAYOS_CLIENT_ID
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PAYOS_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PAYOS_CHECKSUM_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: PAYOS_RETURN_URL
        value: "${APP_URL}/checkout/payos/return"
        scope: RUN_TIME
      - key: PAYOS_CANCEL_URL
        value: "${APP_URL}/checkout/payos/cancel"
        scope: RUN_TIME
      - key: GEMINI_API_KEY
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
        scope: RUN_TIME
      - key: GEMINI_DEMO_MODE
        value: "false"
        scope: RUN_TIME

databases:
  - name: clothing-store-db
    cluster_name: clothing-store-db
    db_name: cloth_db
    db_user: doadmin
    engine: MYSQL
    production: true
